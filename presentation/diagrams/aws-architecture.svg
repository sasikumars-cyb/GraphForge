<svg width="1180" height="620" viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <defs>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Internet -->
  <circle cx="80" cy="60" r="30" fill="#10172B" stroke="#A6AFC3" stroke-width="1.5"/>
  <text x="80" y="65" fill="#F4F6FB" font-size="12" text-anchor="middle">Internet</text>

  <!-- Route53 -->
  <rect x="180" y="35" width="120" height="50" rx="12" fill="#FF990022" stroke="#FF9900" stroke-width="2"/>
  <text x="240" y="65" fill="#FFB84D" font-size="13" font-weight="700" text-anchor="middle">Route53</text>
  <line x1="110" y1="60" x2="180" y2="60" stroke="#A6AFC3" stroke-width="1.5"/>

  <!-- ACM -->
  <rect x="330" y="35" width="120" height="50" rx="12" fill="#FF990022" stroke="#FF9900" stroke-width="2"/>
  <text x="390" y="58" fill="#FFB84D" font-size="12" font-weight="700" text-anchor="middle">ACM</text>
  <text x="390" y="74" fill="#A6AFC3" font-size="9.5" text-anchor="middle">TLS cert</text>
  <line x1="300" y1="60" x2="330" y2="60" stroke="#A6AFC3" stroke-width="1.5"/>

  <!-- VPC boundary -->
  <rect x="40" y="120" width="1100" height="440" rx="20" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="60" y="145" fill="#818CF8" font-size="13" font-weight="700">VPC</text>

  <!-- ALB -->
  <rect x="480" y="160" width="160" height="60" rx="14" fill="#FF990022" stroke="#FF9900" stroke-width="2" filter="url(#soft2)"/>
  <text x="560" y="185" fill="#FFB84D" font-size="14" font-weight="700" text-anchor="middle">ALB</text>
  <text x="560" y="203" fill="#A6AFC3" font-size="10" text-anchor="middle">path-based routing</text>
  <line x1="390" y1="60" x2="560" y2="160" stroke="#A6AFC3" stroke-width="1.5"/>

  <!-- Public subnet label -->
  <rect x="420" y="140" width="280" height="100" rx="14" fill="none" stroke="#6B7488" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="440" y="152" fill="#6B7488" font-size="9.5">public subnet</text>

  <!-- Backend ECS -->
  <rect x="150" y="290" width="220" height="90" rx="16" fill="#4F46E522" stroke="#4F46E5" stroke-width="2" filter="url(#soft2)"/>
  <text x="260" y="320" fill="#F4F6FB" font-size="14" font-weight="700" text-anchor="middle">ECS Fargate</text>
  <text x="260" y="338" fill="#A6AFC3" font-size="11" text-anchor="middle">backend (FastAPI)</text>
  <text x="260" y="356" fill="#818CF8" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">desiredCount = 1</text>
  <line x1="500" y1="220" x2="290" y2="290" stroke="#A6AFC3" stroke-width="1.5"/>
  <text x="330" y="270" fill="#6B7488" font-size="9.5">/api/*</text>

  <!-- Frontend ECS -->
  <rect x="720" y="290" width="220" height="90" rx="16" fill="#4F46E522" stroke="#4F46E5" stroke-width="2" filter="url(#soft2)"/>
  <text x="830" y="320" fill="#F4F6FB" font-size="14" font-weight="700" text-anchor="middle">ECS Fargate</text>
  <text x="830" y="338" fill="#A6AFC3" font-size="11" text-anchor="middle">frontend (Nginx SPA)</text>
  <text x="830" y="356" fill="#818CF8" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">scales freely</text>
  <line x1="620" y1="220" x2="830" y2="290" stroke="#A6AFC3" stroke-width="1.5"/>
  <text x="700" y="270" fill="#6B7488" font-size="9.5">/*</text>

  <!-- Private subnet label -->
  <rect x="120" y="270" width="850" height="270" rx="14" fill="none" stroke="#6B7488" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="284" fill="#6B7488" font-size="9.5">private subnet</text>

  <!-- RDS -->
  <rect x="150" y="440" width="200" height="80" rx="16" fill="#00A86B22" stroke="#00A86B" stroke-width="2" filter="url(#soft2)"/>
  <text x="250" y="470" fill="#34D399" font-size="14" font-weight="700" text-anchor="middle">RDS PostgreSQL</text>
  <text x="250" y="488" fill="#A6AFC3" font-size="10.5" text-anchor="middle">Multi-AZ · Engineering Memory</text>
  <line x1="260" y1="380" x2="250" y2="440" stroke="#A6AFC3" stroke-width="1.5"/>

  <!-- Neo4j -->
  <rect x="380" y="440" width="200" height="80" rx="16" fill="#00A86B22" stroke="#00A86B" stroke-width="2" filter="url(#soft2)"/>
  <text x="480" y="470" fill="#34D399" font-size="14" font-weight="700" text-anchor="middle">Neo4j</text>
  <text x="480" y="488" fill="#A6AFC3" font-size="10.5" text-anchor="middle">Aura or self-hosted EC2</text>
  <line x1="290" y1="380" x2="470" y2="440" stroke="#A6AFC3" stroke-width="1.5"/>

  <!-- Bedrock -->
  <rect x="620" y="440" width="200" height="80" rx="16" fill="#8B5CF622" stroke="#8B5CF6" stroke-width="2" filter="url(#soft2)"/>
  <text x="720" y="465" fill="#A78BFA" font-size="14" font-weight="700" text-anchor="middle">Amazon Bedrock</text>
  <text x="720" y="483" fill="#A6AFC3" font-size="10.5" text-anchor="middle">Claude via IAM Task Role</text>
  <text x="720" y="500" fill="#6B7488" font-size="9" text-anchor="middle">zero static AWS keys</text>
  <line x1="270" y1="380" x2="700" y2="440" stroke="#A6AFC3" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Secrets Manager -->
  <rect x="850" y="440" width="200" height="80" rx="16" fill="#FF990022" stroke="#FF9900" stroke-width="2" filter="url(#soft2)"/>
  <text x="950" y="465" fill="#FFB84D" font-size="13" font-weight="700" text-anchor="middle">Secrets Manager</text>
  <text x="950" y="483" fill="#A6AFC3" font-size="10" text-anchor="middle">DB/Neo4j/JWT/token keys</text>
  <line x1="350" y1="380" x2="900" y2="440" stroke="#A6AFC3" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>

  <!-- CloudWatch -->
  <rect x="960" y="290" width="150" height="70" rx="14" fill="#FF990022" stroke="#FF9900" stroke-width="1.5"/>
  <text x="1035" y="318" fill="#FFB84D" font-size="12" font-weight="700" text-anchor="middle">CloudWatch</text>
  <text x="1035" y="335" fill="#A6AFC3" font-size="9.5" text-anchor="middle">logs · alarms</text>
  <line x1="940" y1="330" x2="960" y2="325" stroke="#A6AFC3" stroke-width="1" stroke-dasharray="3 4"/>
</svg>
