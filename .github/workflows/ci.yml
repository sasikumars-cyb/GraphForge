name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Auth tests hit a real Postgres (see tests/conftest.py's transactional
      # db_session fixture) - an ephemeral service container is a clean DB
      # every run, no separate test-database setup needed.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: graphforge
          POSTGRES_PASSWORD: graphforge
          POSTGRES_DB: graphforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graphforge -d graphforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Indexer pipeline tests persist a real architecture graph (see
      # tests/integration/test_indexing_pipeline.py) - same image as
      # docker/docker-compose.yml's neo4j service.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/graphforge-dev
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://graphforge:graphforge@localhost:5432/graphforge
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphforge-dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build
