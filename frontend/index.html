<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="GraphForge - AI Engineering Intelligence Platform." />

    <meta name="theme-color" content="#0F172A" />

    <link rel="icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>GraphForge | AI Engineering Intelligence Platform</title>

    <script>
      // Stamps `data-theme` before first paint so the correct theme's CSS
      // variables are already active when React mounts — without this, the
      // page would flash the bare `:root` (Light) fallback and then jump to
      // the stored theme a frame later. Kept as a tiny inline script (no
      // external file) so it can't be delayed by the module bundle loading.
      (function () {
        try {
          var validThemes = ["light", "dark", "midnight", "modern-blue", "high-contrast"];
          var stored = localStorage.getItem("graphforge.theme");
          document.documentElement.setAttribute(
            "data-theme",
            validThemes.indexOf(stored) !== -1 ? stored : "light",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
