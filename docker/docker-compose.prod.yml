# Production-style stack: backend runs without --reload, frontend is a static
# build served by Nginx. Dockerfiles live with the code they build
# (../backend, ../frontend); this file only wires the three services together.
#
# Usage: `docker compose -f docker/docker-compose.prod.yml up --build`
# (scripts/docker-prod.sh does this for you).
#
# For local day-to-day development with hot reload, use
# docker/docker-compose.yml instead (`scripts/docker-dev.sh`).

# Explicit project name so this stack's volumes/network never collide with
# docker-compose.yml's dev stack, even though both files live in this directory.
name: graphforge-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphforge
      POSTGRES_PASSWORD: graphforge
      POSTGRES_DB: graphforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphforge -d graphforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/graphforge-dev
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://graphforge:graphforge@db:5432/graphforge
      CORS_ALLOW_ORIGINS: '["http://localhost:8080"]'
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphforge-dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres-data:
  neo4j-data:
