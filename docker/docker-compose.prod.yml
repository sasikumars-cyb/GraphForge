# Production-style stack: backend runs without --reload, frontend is a static
# build served by Nginx. Dockerfiles live with the code they build
# (../backend, ../frontend); this file only wires the three services together.
#
# Usage: `docker compose -f docker/docker-compose.prod.yml up --build`
# (scripts/docker-prod.sh does this for you).
#
# For local day-to-day development with hot reload, use
# docker/docker-compose.yml instead (`scripts/docker-dev.sh`).

# Explicit project name so this stack's volumes/network never collide with
# docker-compose.yml's dev stack, even though both files live in this directory.
name: graphforge-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphforge
      # Required, no fallback default — a production database must never
      # run with a well-known, publicly-visible password. Set
      # POSTGRES_PASSWORD in docker/.env (git-ignored, same mechanism the
      # AWS_* Bedrock credentials use in docker-compose.yml); Compose fails
      # fast with this message if it's missing rather than silently
      # falling back to something guessable.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env before running the prod stack}
      POSTGRES_DB: graphforge
    # No host port publishing here — only the `backend` service (same
    # Compose network, reaching it as `db:5432`) needs access. Publishing
    # to the host was unnecessary exposure for a production database.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphforge -d graphforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      # Same requirement as POSTGRES_PASSWORD above — set NEO4J_PASSWORD in
      # docker/.env; never a hardcoded/dev credential in production.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in docker/.env before running the prod stack}
    # No host port publishing — only `backend` needs `neo4j:7687` over the
    # Compose network. The Neo4j Browser (7474) isn't needed in production.
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://graphforge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env before running the prod stack}@db:5432/graphforge
      CORS_ALLOW_ORIGINS: '["http://localhost:8080"]'
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in docker/.env before running the prod stack}
      # Required in production — see backend/app/core/config.py's
      # jwt_secret_key/token_encryption_key fields for why the built-in
      # defaults are unsafe to run with (they're public, checked into the
      # repo). Set both in docker/.env.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in docker/.env before running the prod stack}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in docker/.env before running the prod stack}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
      # Relative path - same-origin, proxied to `backend:8000` by
      # docker/nginx/nginx.conf's /api/ rule below. Without this, Vite bakes
      # in client.ts's dev-only fallback ("http://localhost:8000/api/v1"),
      # which silently points every deployed browser at its own localhost.
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres-data:
  neo4j-data:
