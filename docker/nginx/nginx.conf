# Serves the built React SPA and proxies /api to the backend so the
# frontend can call a relative /api path in production without CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: any non-file, non-API route resolves to index.html so
    # React Router can handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
