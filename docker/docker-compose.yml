# One-command local dev environment: Postgres + backend (uvicorn --reload) +
# frontend (Vite dev server), all containerized with source bind-mounted for
# hot reload. Requires only Docker - no local Python or Node install needed.
#
# Usage: `docker compose -f docker/docker-compose.yml up --build`
# (scripts/docker-dev.sh does this for you).
#
# For a production-style build (Nginx-served static frontend, backend without
# --reload), use docker/docker-compose.prod.yml instead.

# Explicit project name so this stack's volumes/network never collide with
# docker-compose.prod.yml's, even though both files live in this directory.
name: graphforge-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphforge
      POSTGRES_PASSWORD: graphforge
      POSTGRES_DB: graphforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphforge -d graphforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    # Architecture graph storage for the indexer (Phase 6) — see app/graph.
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/graphforge-dev
    ports:
      - "7474:7474" # Neo4j Browser (http://localhost:7474)
      - "7687:7687" # Bolt protocol - what the app connects to
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://graphforge:graphforge@db:5432/graphforge
      CORS_ALLOW_ORIGINS: '["http://localhost:5173","http://localhost:5174"]'
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphforge-dev
      # Bedrock (boto3) reads these from the real process environment, not
      # from backend/.env - values come from docker/.env (git-ignored,
      # never committed), substituted in here by Docker Compose. Empty
      # defaults so compose doesn't warn/fail when docker/.env hasn't been
      # created yet (Bedrock just stays unconfigured until it has).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the source for hot reload; the anonymous volume beneath it
      # masks the host's own backend/.venv (if any) so it never leaks into
      # the container - the image's own site-packages are what actually run.
      - ../backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      # Same pattern as backend: bind-mount source for hot reload, anonymous
      # volume so the container's own Linux-built node_modules always wins
      # over whatever (possibly incompatible) node_modules is on the host.
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  neo4j-data:
