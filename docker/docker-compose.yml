# One-command local dev environment: Postgres + backend (uvicorn --reload) +
# frontend (Vite dev server), all containerized with source bind-mounted for
# hot reload. Requires only Docker - no local Python or Node install needed.
#
# Usage: `docker compose -f docker/docker-compose.yml up --build`
# (scripts/docker-dev.sh does this for you).
#
# For a production-style build (Nginx-served static frontend, backend without
# --reload), use docker/docker-compose.prod.yml instead.

# Explicit project name so this stack's volumes/network never collide with
# docker-compose.prod.yml's, even though both files live in this directory.
name: graphforge-dev

# Explicit subnet for the default network. Without this, Compose
# auto-assigns one from Docker's default pool (172.17.0.0/16 upward) —
# which on a machine running a corporate VPN can land squarely inside a
# range the VPN also routes (observed: this project's auto-picked
# 172.20.0.0/16 exactly matched a `172.20.0.0/16 via tun0` VPN route,
# silently blackholing every request to a container on this network from
# the host — `docker exec` into the container worked fine throughout,
# since that never leaves the container's own namespace; only host→container
# traffic vanished into the tunnel). 172.23.0.0/16 is outside every
# VPN-routed CIDR and every other Docker network on this host as of this
# writing; if it ever collides again, `ip route show dev tun0` and
# `docker network ls` (then `docker network inspect` each) show what to
# steer clear of next.
networks:
  default:
    ipam:
      config:
        - subnet: 172.23.0.0/16

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphforge
      POSTGRES_PASSWORD: graphforge
      POSTGRES_DB: graphforge
    ports:
      # Host port bumped to 5433 - 5432 is commonly already taken by another
      # local Postgres (e.g. a different project's docker-compose stack).
      # The backend container itself connects via the internal Docker network
      # (DATABASE_URL uses host "db", not localhost) so this only affects
      # host-side tools (psql, a GUI client) wanting to reach Postgres directly.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphforge -d graphforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    # Architecture graph storage for the indexer (Phase 6) — see app/graph.
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/graphforge-dev
    ports:
      - "7474:7474" # Neo4j Browser (http://localhost:7474)
      - "7687:7687" # Bolt protocol - what the app connects to
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    # List form (not the usual `KEY: value` mapping) so AWS_PROFILE below can
    # use bare-name pass-through - see the comment on that line for why.
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://graphforge:graphforge@db:5432/graphforge
      - CORS_ALLOW_ORIGINS=["http://localhost:5173","http://localhost:5174"]
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphforge-dev
      # Bedrock (boto3) reads these from the real process environment, not
      # from backend/.env - values come from docker/.env (git-ignored,
      # never committed) and the shell, substituted in here by Docker
      # Compose. Empty defaults so compose doesn't warn/fail when unset -
      # botocore's EnvProvider treats an empty string as "not set" and
      # falls through to the next provider in the credential chain, so
      # leaving these blank is exactly what makes AWS_PROFILE / the ~/.aws
      # mount below work (see docs/bedrock-setup.md).
      #
      # Precedence (standard boto3 chain): explicit keys > AWS_PROFILE >
      # IAM role. Set AWS_PROFILE (recommended - survives SSO re-login
      # with no docker/.env edits) OR the three AWS_* keys below, not
      # both - if both are set, the explicit keys win and AWS_PROFILE is
      # ignored.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      # Bare name (no `=value`): Compose passes AWS_PROFILE through only if
      # it's actually defined in docker/.env or the shell, and OMITS the key
      # from the container entirely otherwise - unlike the `${VAR:-}` map
      # form used above, this never injects an empty string. That matters
      # specifically for AWS_PROFILE because botocore treats AWS_PROFILE=""
      # as an explicit (invalid) profile name and raises ProfileNotFound,
      # rather than falling through like it does for the credential keys
      # above (verified empirically - see backend/docker-entrypoint.sh for
      # the remaining defense-in-depth: this alone doesn't cover every case,
      # e.g. docker/.env containing a literal blank `AWS_PROFILE=` line).
      - AWS_PROFILE
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the source for hot reload; the anonymous volume beneath it
      # masks the host's own backend/.venv (if any) so it never leaks into
      # the container - the image's own site-packages are what actually run.
      - ../backend:/app
      - /app/.venv
      # AWS SSO / shared-config support: the dev image's `dev` stage (see
      # backend/Dockerfile) has no USER directive, so it runs as root and
      # HOME=/root - mounted here, not /home/appuser (that's the `runtime`
      # stage's user, used only by docker-compose.prod.yml, which relies on
      # an IAM role instead and needs no mount at all). Read-only: the
      # container only needs to read cached SSO tokens and profile config,
      # never write them. If ~/.aws doesn't exist on the host, Docker
      # creates it as an empty directory automatically - harmless, and
      # AWS_PROFILE/AWS_ACCESS_KEY_ID being unset just leaves Bedrock
      # unconfigured either way. See docs/bedrock-setup.md.
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      # Same pattern as backend: bind-mount source for hot reload, anonymous
      # volume so the container's own Linux-built node_modules always wins
      # over whatever (possibly incompatible) node_modules is on the host.
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  neo4j-data:
