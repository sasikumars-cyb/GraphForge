# Expected Frontier Hypothesis Generator output (Validation 8), captured
# from Engineering Memory's `confidence_state` distribution per
# repository — every `KnowledgeRelationship` row traces back to one or
# more `hypothesis_ids` (ADR 0018), so this distribution IS the Frontier
# Generator's output, not a separate concept to re-derive.
#
# `candidate` is 0 for every repository below: the shadow hypothesis
# pipeline's deterministic-evidence-backed hypotheses (imports,
# annotations, manifest entries — exactly what these small, clean
# fixture repos consist of almost entirely) resolve straight to
# `highly_likely`/`verified` on first pass, with no repository in this
# suite currently producing a genuinely ambiguous, low-corroboration
# hypothesis. This is expected for hand-authored fixture repos with
# unambiguous structure — it does not mean candidate-tier hypotheses are
# broken; see docs/validation-guide.md.
#
# `generated == verified + highly_likely + likely + candidate +
# rejected + conflicting` always (every row is in exactly one state) —
# `validated` is every row that isn't sitting at `candidate` (i.e. has
# passed at least one validation pass since being generated).

