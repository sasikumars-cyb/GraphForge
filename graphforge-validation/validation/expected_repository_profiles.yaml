    language: python
    node_count: 31
    edge_count: 35
    endpoint_count: 0 # no @app.get/@app.post extraction for Python yet — see Known Gaps
    dependency_count: 8
    dependencies: [asyncpg, fastapi, pydantic, pydantic-settings, redis, shared-python-sdk, sqlalchemy, uvicorn]
    kafka_topics: []
    databases: []
    feign_clients: []
    sdk_usage: [shared-python-sdk]
    repository_understanding:
      purpose_keywords: [customer, checkout]
      business_capability_keywords: [customer]
      security_keywords: []
    dependency_query:
      direct_dependency_repos: [] # see Known Gaps — no CALLS_SERVICE cross-repo edges detected currently
