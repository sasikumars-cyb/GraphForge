# Expected per-repository graph shape (Validation 1) and Repository
# Understanding Agent output (Validation 3).
#
# All `supported` numbers were captured from a real indexed run against
# the live GraphForge instance (see docs/validation-guide.md's "Ground
# truth capture" section) — not estimated from source code. Node/edge
# counts include the `GraphNode`/`Component`/etc. label rollups
# GraphForge's own builder produces (app/indexer/graph/builder.py), so a
# genuine parser change (new node type, new edge type) will move these
# numbers — that's the point.
#
# `kafka_topics: []` and `databases: []` on every Python/Java repo below
# are NOT placeholders — they are the actual, current, verified output.
# See docs/validation-guide.md "Known Gaps" for why: GraphForge's Kafka
# extractor only recognizes an inline string literal in
# `@KafkaListener(topics = "...")` and a `KafkaTemplate.send(...)` call in
# the *same* class (app/indexer/extractors/kafka.py) — every repo here
# either uses a named constant (`TOPIC`) or delegates through a shared-SDK
# publisher, both of which defeat that heuristic, and there is no Python
# Kafka extractor at all yet. Likewise no repo has a detected `DataTable`
# node — `app.indexer.graph.builder` can render one but no parser
# currently populates `ArchitectureModel`'s table list from a SQLAlchemy
# `__tablename__` or JPA `@Entity`. These are real GraphForge gaps, not
# suite bugs — do not "fix" them by editing the fixture repos (frozen, per
# the RFC) or by inflating these numbers to what the architecture
# *should* produce.

supported:
