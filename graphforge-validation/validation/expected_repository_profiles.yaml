# Repositories GraphForge is expected to still correctly reject as
# unsupported in this phase (app/indexer/services/indexing_service.py:
# "Java + Spring Boot (Maven) and Python are supported in this phase").
# This is a real regression check, not a placeholder: if any of these
# ever indexes successfully, GraphForge gained language support and this
# file (plus a real `supported` entry for it) needs updating; if any of
# these starts failing with a *different* error, something broke.
