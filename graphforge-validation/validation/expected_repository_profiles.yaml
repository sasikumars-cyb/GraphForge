    expected_status: failed
    error_contains: "not supported yet"
  - name: terraform-modules
    language: terraform
    expected_status: failed
    error_contains: "not supported yet"
  - name: helm-charts
    language: helm
    expected_status: failed
    error_contains: "not supported yet"
  - name: kubernetes-platform
