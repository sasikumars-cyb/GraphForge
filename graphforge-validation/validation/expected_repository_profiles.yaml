# Expected per-repository graph shape (Validation 1) and Repository
# Understanding Agent output (Validation 3).
#
# All `supported` numbers were captured from a real indexed run against
# the live GraphForge instance (see docs/validation-guide.md's "Ground
# truth capture" section) — not estimated from source code. Node/edge
# counts include the `GraphNode`/`Component`/etc. label rollups
# GraphForge's own builder produces (app/indexer/graph/builder.py), so a
# genuine parser change (new node type, new edge type) will move these
# numbers — that's the point.
#
# `kafka_topics` is now real, non-empty output for every repo that
# actually produces/consumes one — GraphForge's Kafka extractor (Java:
# app/indexer/extractors/kafka.py; Python: app/indexer/extractors/python/
# kafka.py) resolves both a same-class/module `TOPIC = "literal"` constant
# and delegation through the shared-SDK publisher/consumer wrapper (Gap 1
# of the 2026-08-03 gap-closure sprint — see docs/validation-guide.md).
#
# `databases: []` on every repo below IS still a real, current gap, not a
# placeholder: no repo has a detected `DataTable` node —
# `app.indexer.graph.builder` can render one but no parser currently
# populates `ArchitectureModel`'s table list from a SQLAlchemy
# `__tablename__` or JPA `@Entity`. This is a real, undetected GraphForge
# gap, not a suite bug — do not "fix" it by editing the fixture repos
# (frozen, per the RFC) or by inflating this to what the architecture
# *should* produce.
#
# `node_count`/`edge_count` below also include each repository's outgoing
# cross-repository edges (CALLS_SERVICE/SHARES_TOPIC/DEPENDS_ON_REPOSITORY)
# — `GET /repositories/{id}/graph` reads via `IGraphRepository.get_full_
# graph`, whose Cypher used to filter an edge's *target* to the same
# repository_id as the seed, structurally excluding every cross-repository
# edge even though it existed in Neo4j (Gap 4/5 root cause, fixed
# 2026-08-03 — see docs/validation-guide.md).

