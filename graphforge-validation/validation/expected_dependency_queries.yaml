# Expected Dependency Query Agent output (Validation 4), captured from
# real Engineering Memory state (EngineeringMemoryService.
# get_current_relationships) — the exact data source
# app.services.engineering_intelligence.dependency_query_service.search
# reads from.
#
# IMPORTANT — read before "fixing" a FAIL here: the agent's
# `direct_dependencies` field is currently populated from EVERY
# relationship whose `source_entity` starts with the queried
# repository's own id prefix — see
# app/agents/dependency_query/renderer.py::_split_by_direction. Because
# Engineering Memory only stores intra-repository structural
# relationships today (CONTAINS/CALLS/DEPENDS_ON-to-own-manifest-entries
# — cross_repo_linker's CALLS_SERVICE/SHARES_TOPIC/DEPENDS_ON_REPOSITORY
# edges are written to Neo4j only, never to Engineering Memory), EVERY
# current relationship's source matches that prefix. The practical
# effect: `direct_dependencies_count` below equals the repository's
# TOTAL relationship count, not a count of genuine cross-repository
# package dependencies, and `downstream_consumers_count` is always 0
# (the `elif target_entity.startswith(prefix)` branch can only fire for
# a relationship whose source does NOT start with the prefix, which
# never happens for intra-repo data). See docs/validation-guide.md
# "Known Gaps" — this is a real, verified-in-code limitation of the
# current agent/Engineering-Memory integration, not a suite defect.
# `downstream_consumers_count: 0` is asserted as a structural certainty
# (provable from the renderer's own logic), not just an observation.

repositories:
  - name: customer-service-python
    direct_dependencies_count: 36
    downstream_consumers_count: 0
    confidence_breakdown: { high: 35, medium: 1, low: 0 }
