# Expected Dependency Query Agent output (Validation 4), captured from
# real Engineering Memory state (EngineeringMemoryService.
# get_current_relationships) — the exact data source
# app.services.engineering_intelligence.dependency_query_service.search
# reads from.
#
# Recaptured 2026-08-03 after the gap-closure sprint: `direct_dependencies
# _count` below is now higher than before for repos with a real
# CALLS_SERVICE/SHARES_TOPIC/DEPENDS_ON_REPOSITORY match, because those
# cross-repository relationships now persist to Engineering Memory too
# (they always did — see cross_repo_memory.py's ADR 0018 RFC-05
# implementation; what was missing was the Kafka/Feign detection to give
# it anything to find, closed by this sprint's Gap 1/Gap 2 fixes).
#
# `downstream_consumers_count: 0` is still asserted for every repo, and
# still a genuine structural certainty, not a stale leftover: this
# specific field comes from
# app/agents/dependency_query/renderer.py::_split_by_direction, which
# buckets a relationship as a "downstream consumer" only when its
# `target_entity` (not `source_entity`) starts with the queried
# repository's own id prefix. Every relationship persisted under a given
# repository's own Engineering-Memory partition has that repository as
# its `source_entity` by construction (`cross_repo_memory.py::_persist_
# pair` always stores under the hypothesis's own source `repo_id`), so
# `target_entity` never matches — the query is also explicitly scoped to
# one repository (`DependencyQueryAgent.build_service_requests`:
# `repository_ids=(repository_id,)`), so another repository's outgoing
# relationship into this one is never read from here in the first place.
# This is a distinct, still-open gap from the one this sprint closed
# (see docs/validation-guide.md) — closing it would mean either querying
# multiple repositories' partitions per lookup or indexing relationships
# by target as well as source; out of this sprint's scope.

