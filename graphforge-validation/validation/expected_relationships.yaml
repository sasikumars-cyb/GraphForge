# Expected relationship graph (Validation 2), captured from a real run
# against the live GraphForge instance. See docs/validation-guide.md for
# how to recapture this after a legitimate GraphForge change.
#
# cross_repository_edges: every CALLS_SERVICE / SHARES_TOPIC /
# DEPENDS_ON_REPOSITORY edge `GET /repositories/cross-repository-edges`
# currently returns among the suite's supported repos. Recaptured
# 2026-08-03 after the gap-closure sprint closed three real GraphForge
# gaps (see docs/validation-guide.md "Known Gaps", now "Closed Gaps"):
# Python + delegated-SDK Kafka topic detection, Feign-target language-
# suffix matching, and `get_full_graph` excluding cross-repository edges
# from its read. SHARES_TOPIC is directional-but-symmetric by
# construction (`cross_repo_linker.compute_edges` evaluates every ordered
# pair independently), so a shared topic between two repos always
# produces both A->B and B->A edges — both are real, not a duplicate.
#
# within_repository_edge_types: the full edge-type tally within each
# repo's own `GET /repositories/{id}/graph` response
# (app/indexer/graph/builder.py plus, since the `get_full_graph` fix,
# that repository's own outgoing cross-repository edges — CALLS_SERVICE/
# SHARES_TOPIC/DEPENDS_ON_REPOSITORY are legitimately part of "this
# repo's edges" now, not a separate bucket).

cross_repository_edges:
  - type: CALLS_SERVICE
    source: shipping-service-java
    target: inventory-service-python
  - type: DEPENDS_ON_REPOSITORY
    source: agent-runtime
    target: prompt-library
