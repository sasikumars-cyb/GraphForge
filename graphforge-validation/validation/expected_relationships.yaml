# Known-absent today — see module docstring above. Listed explicitly (not
# omitted) so the framework can distinguish "still correctly absent" from
# "silently never checked." Two entries that were here before the
# 2026-08-03 gap-closure sprint (CALLS_SERVICE shipping->inventory,
# SHARES_TOPIC inventory<->shipping) are now real edges above — removed
# from this list, not left to rot as a stale "known gap" doc.
known_absent_cross_repository_edges:
  - type: CALLS_SERVICE
    source: customer-service-python
    target: order-service-python
    reason: "No Feign/service-name annotation in Python — cross_repo_linker has no REST-call detection for Python callers at all (a different, still-open gap)"

