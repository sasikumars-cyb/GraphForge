# Expected Impact Analysis Agent output (Validation 5), captured by
# calling app.services.engineering_intelligence.impact_analysis_service
# .compute_blast_radius directly (the same deterministic call the agent
# makes) for each of the 4 repositories named in the RFC.
#
# Recaptured 2026-08-03 after the gap-closure sprint closed the
# cross-repository traversal gap: `IGraphRepository.get_neighborhood`'s
# Cypher used to filter BOTH endpoints of every traversed edge to the
# seed's own `repository_id`, so a cross-repository edge (whose target is
# by definition in a different repository) could never be reached
# regardless of which edge types `_IMPACT_EDGE_TYPES` nominally listed.
# Fixed in app/graph/neo4j_repository.py's `get_neighborhood` (both the
# node-discovery and induced-subgraph passes) — the edge *type* already
# enforces the repository boundary correctly (a cross-repository rel type
# only ever connects two Repository nodes, by construction of
# cross_repo_linker.py), so the extra property filter on the far endpoint
# was blocking the real case without adding real safety for the
# single-repository one. `SHARES_TOPIC` was also added to
# `_IMPACT_EDGE_TYPES` (previously only CALLS_SERVICE and
# DEPENDS_ON_REPOSITORY were cross-repository-capable there), since the
# RFC's own validation target (payment-service-java should impact
# inventory-service-python/shipping-service-java/notification-service-
# python) is reached via real Kafka-topic overlap, not Feign or
# dependency-name edges. See docs/validation-guide.md.
#
# `impacted_repositories` below is real, verified blast radius — every
# entry is backed by an actual CALLS_SERVICE/SHARES_TOPIC/DEPENDS_ON_
# REPOSITORY edge reachable within 2 undirected hops (traversal direction
# is deliberately bidirectional — see `get_neighborhood`'s own docstring:
# "a caller of X is exactly as relevant to X's neighborhood as something
# X calls"). `impacted_apis_count`/`impacted_databases_count`/
# `impacted_queues_count` remain 0 for a different, still-open reason:
# GraphForge has no Endpoint extraction for Python (Known Gaps) and no
# DataTable extraction for either language yet, so there are no such
# nodes anywhere in these repositories' graphs to reach, cross-repository
# or not.
#
# relationship_count / confidence_summary come from
# relationship_lookup.fetch_with_confidence, summed over EVERY repository
# in `impacted_repositories` (compute_blast_radius's own logic — not just
# the seed anymore, now that the blast radius genuinely spans multiple
# repositories).

repositories:
  - name: payment-service-java
    direction: downstream
    max_hops: 2
    impacted_repositories: [analytics-pipeline-python, inventory-service-python, notification-service-python, order-service-python, payment-service-java, shared-java-sdk, shared-python-sdk, shipping-service-java]
    impacted_apis_count: 0
    impacted_databases_count: 0
    impacted_queues_count: 0
    relationship_count: 237
    confidence_summary: { high: 231, medium: 6, low: 0 }

  - name: order-service-python
