[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphforge-backend"
version = "0.1.0"
description = "GraphForge backend: AI-powered engineering intelligence platform."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "cryptography>=43",
    "neo4j>=5.24",
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-python (>=0.25.0,<0.26.0)",
    "boto3>=1.35",
    # <2.0: 2.0 renamed/reshaped streamablehttp_client's signature (headers/timeout
    # kwargs removed) - app/tools/mcp_support.py is written against the 1.x API.
    "mcp>=1.6,<2.0",
    # Required by FastAPI/Starlette to parse multipart/form-data (UploadFile) -
    # app/api/v1/routers/test_case_uploads.py's CSV/Excel upload endpoint.
    "python-multipart>=0.0.12",
    # .xlsx parsing for the same upload endpoint - .csv needs no extra
    # dependency (stdlib `csv`).
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML/CSS template literals (report rendering markup) — each
# "line" is a literal fragment of rendered output, not prose or code
# structure; wrapping it to satisfy line-length would either alter the
# rendered HTML's whitespace or require breaking a single template
# expression across an f-string boundary, both worse than the line being
# long. E501 doesn't meaningfully apply to this file's content.
"app/agents/api_intelligence/renderers.py" = ["E501"]
# Literal LLM prompt-instruction text, built from adjacent string
# constants — re-splitting each long line risks silently inserting or
# dropping a space at the join point in text sent verbatim to the model.
# Mechanical line-length is not a meaningful signal for prompt content.
"app/agents/api_intelligence/agent.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection requires calling Depends()/Query()/Body()
# in argument defaults - that's the framework's own pattern, not the bug
# B008 normally warns about.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# boto3/botocore ship no inline types and no stub package is installed
# (adding boto3-stubs is a much heavier dependency than this one provider
# file justifies). Scoped to exactly these two packages, not a blanket
# ignore_missing_imports, so a real missing-stub issue elsewhere still fails.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# openpyxl ships no inline types; types-openpyxl exists but is a separate
# dependency this one parser (test_case_upload_parser.py) doesn't justify
# pulling in. Same scoped-override reasoning as boto3/botocore above.
[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session, not one per test: app.database.session
# creates its async engine once at import time, and asyncpg connections can't
# be reused across different event loops. Both settings must match, or
# fixtures and test bodies end up on two different loops instead of one.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
